<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="w-full h-screen bg-gradient-to-tr from-slate-600 to-sky-950">
      <div
        id="weather-wrapper"
        class="absolute top-[50%] left-[50%] -translate-x-[50%] -translate-y-[50%] w-[400px] h-auto bg-black/50 backdrop-blur-lg p-10 rounded-tr-3xl rounded-bl-3xl"
      >
        <div>
          <div id="search" class="flex items-center gap-3">
            <input
              type="text"
              placeholder="Enter city name"
              class="w-full rounded-full px-5 py-2"
            />
            <button id="search" class="bg-white w-11 h-9 rounded-full">
              <i class="fa-solid fa-magnifying-glass"></i>
            </button>
          </div>
          <div class="error text-white p-3">
            <h1>please enter correct city</h1>
          </div>
        </div>
        <div id="weather" class="flex flex-col items-center justify-center my-5">
          <div  class="flex items-center gap-10 my-8">
            <img id="weather-info" src="images/clouds.png" alt="" width="100px" height="100px" />
            <div class="flex flex-col items-center">
              <span id="weatherhere" class="text-white font-bold text-4xl">44 °C</span>
              <span id="cityname" class="text-white">Dubai, AE</span>
            </div>
          </div>
          <div class="flex items-center justify-between gap-10">
          <div class="flex items-center gap-3">
            <img src="images/humidity.png" alt="" width="50px" />
            <div class="flex flex-col items-center">
              <span id="humidity" class="text-yellow-100 font-bold text-2xl">50%</span>
              <span class="text-white">Humidity</span>
            </div>
          </div>
          <div class="flex items-center gap-3">
            <img src="images/wind.png" alt="" width="50px" />
            <div class="flex flex-col items-center">
              <span id="wind" class="text-yellow-100 font-bold text-2xl">4 km/h</span>
              <span class="text-white">wind speed</span>
            </div>
          </div>
          </div>
        </div>
      </div>
      <div class="absolute bottom-5 left-[50%] -translate-x-[50%]">
        <h1 class="text-yellow-300 font-bold tracking-wider" >design by omais ahmad</h1>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
